<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LUMEN</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090a10;color:#f2f2f5;font:15px system-ui,Arial}header{position:sticky;top:0;z-index:3;background:#090a10ed;border-bottom:1px solid #282936;padding:16px 20px;display:flex;align-items:center;gap:12px}h1{font-size:25px;margin:0;font-weight:900;letter-spacing:3px}h1 b{color:#e62d44}button{font:inherit;cursor:pointer;border:0;color:white;background:#262733;border-radius:10px;padding:11px 14px}button.primary{background:#db203d}input{padding:12px;border:1px solid #444653;border-radius:10px;background:#171820;color:white;width:100%;font:inherit}main{padding:22px 17px 96px;max-width:1160px;margin:auto}.tag{color:#f74762;font-weight:700;letter-spacing:2px;font-size:12px}h2{margin:9px 0 18px;font-size:25px}.tabs{display:flex;gap:9px;flex-wrap:wrap}.tabs button.active{background:#d8203d}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px}.tile{min-width:0;cursor:pointer}.tile img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#242530;border-radius:11px}.tile h3{margin:9px 0 2px;font-size:13px}.tile small{color:#999ca9}.bar{display:flex;gap:8px;margin:18px 0 26px}.bar input{flex:1}.muted{color:#b2b3c1}.empty{padding:42px 10px;text-align:center;color:#a5a8b5}#detail{display:none}#detail .cover{width:140px;border-radius:12px;float:left;margin:0 20px 15px 0}#detail p{line-height:1.6}#detail:after{display:block;content:'';clear:both}.row{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.episode{display:block;padding:13px;margin:9px 0;background:#1d1f2b;border-radius:10px;width:100%;text-align:left}.vidlink-frame{position:relative;width:100%;aspect-ratio:16/9;min-height:230px;background:#050508;border:1px solid #30313e;border-radius:12px;overflow:hidden}.vidlink-frame iframe{display:block;width:100%;height:100%;border:0;background:#000}.source{padding:14px 0;border-bottom:1px solid #353644}video{width:100%;max-height:55vh;background:#000;border-radius:10px}#player{display:none;margin:18px 0;padding:16px;background:#171923;border-radius:14px}#notice{color:#ffb1bc}footer{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:12px;background:#12131bdc;border-top:1px solid #333;backdrop-filter:blur(12px)}footer button{background:transparent;font-size:13px;padding:8px}#browse h2{margin-top:30px}@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(175px,1fr))}footer{display:none}}
</style></head>
<body>
<header><h1>LUMEN<b>.</b></h1><span style="flex:1"></span><button onclick="testNativeVideo()">Test video</button><button onclick="showProviders()">Sources</button></header>
<main>
<div id="browse">
<p class="tag">MOVIES & TV SERIES</p><h2>Discover something great.</h2>
<div class="tabs"><button id="tabAll" class="active" onclick="setTab('all')">Discover</button><button id="tabMovie" onclick="setTab('movie')">Movies</button><button id="tabSeries" onclick="setTab('series')">TV Shows</button><button id="tabSaved" onclick="setTab('saved')">My List</button></div>
<div class="bar"><input id="search" placeholder="Search movies or shows..." onkeydown="if(event.key==='Enter')searchNow()"><button class="primary" onclick="searchNow()">Search</button></div>
<p id="status" class="muted">Loading Cinemeta titles...</p><div id="cards" class="grid"></div>
</div>
<div id="detail"><button onclick="back()">← Back</button><div id="info" style="margin-top:22px"></div><div id="episodes"></div><div id="sources"></div><div id="player"><video id="video" controls playsinline></video><p id="notice"></p></div></div>
</main>
<footer><button onclick="setTab('all')">Discover</button><button onclick="setTab('movie')">Movies</button><button onclick="setTab('series')">TV Shows</button><button onclick="setTab('saved')">My List</button></footer>
<script>
const API='https://v3-cinemeta.strem.io', $=id=>document.getElementById(id);
let catalog=[], active='all', current=null, episode=null;
let saved=JSON.parse(localStorage.getItem('lumen_saved')||'{}');
let addons=JSON.parse(localStorage.getItem('lumen_addons')||'[]');
const escapeHTML=v=>String(v||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
async function getJSON(url){let r=await fetch(url);if(!r.ok)throw Error('Network error '+r.status);return r.json();}
async function init(){try{let [m,s]=await Promise.all([getJSON(API+'/catalog/movie/top.json'),getJSON(API+'/catalog/series/top.json')]);catalog=[...(m.metas||[]).map(x=>({...x,type:'movie'})),...(s.metas||[]).map(x=>({...x,type:'series'}))];$('status').textContent='';render()}catch(e){$('status').textContent='Unable to load Cinemeta. Check your connection and retry.';}}
function setTab(t){active=t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));let id={all:'tabAll',movie:'tabMovie',series:'tabSeries',saved:'tabSaved'}[t];$(id).classList.add('active');$('browse').style.display='block';$('detail').style.display='none';render();}
function render(items=catalog){let shown=active==='saved'?Object.values(saved):active==='all'?items:items.filter(x=>x.type===active);$('cards').innerHTML=shown.map(x=>'<article class="tile" data-id="'+escapeHTML(x.id)+'" data-type="'+escapeHTML(x.type)+'"><img loading="lazy" alt="" src="'+escapeHTML(x.poster||'')+'"><h3>'+escapeHTML(x.name)+'</h3><small>'+escapeHTML(x.year||x.releaseInfo||'')+'</small></article>').join('');$('status').textContent=shown.length?'':'No titles found.';document.querySelectorAll('.tile').forEach(el=>el.onclick=()=>openTitle(el.dataset.type,el.dataset.id));}
async function searchNow(){let q=$('search').value.trim();if(!q){render();return;}try{$('status').textContent='Searching...';let [m,s]=await Promise.all(['movie','series'].map(t=>getJSON(API+'/catalog/'+t+'/top/search='+encodeURIComponent(q)+'.json').then(x=>(x.metas||[]).map(y=>({...y,type:t})))));let results=[...m,...s];render(results);$('status').textContent=results.length?'':'No results found.';}catch(e){$('status').textContent='Search unavailable.';}}
async function openTitle(t,id){$('browse').style.display='none';$('detail').style.display='block';$('info').innerHTML='<p class="muted">Loading details...</p>';$('episodes').innerHTML='';$('sources').innerHTML='';$('player').style.display='none';try{let data=await getJSON(API+'/meta/'+t+'/'+encodeURIComponent(id)+'.json');current={...data.meta,type:t};episode=null;$('info').innerHTML='<img class="cover" src="'+escapeHTML(current.poster||'')+'"><h2>'+escapeHTML(current.name)+'</h2><p class="muted">'+escapeHTML(current.year||current.releaseInfo||'')+' · '+escapeHTML(current.genres?.join(', ')||t)+'</p><p>'+escapeHTML(current.description||'No description available.')+'</p><div class="row"><button class="primary" id="watchBtn">▶ Watch with Vidlink</button><button id="saveBtn">'+(saved[id]?'♥ Remove from My List':'♡ Add to My List')+'</button></div>';$('watchBtn').onclick=()=>openVidlink();$('saveBtn').onclick=()=>{if(saved[id])delete saved[id];else saved[id]={id:current.id,name:current.name,poster:current.poster,type:t,year:current.year};localStorage.setItem('lumen_saved',JSON.stringify(saved));$('saveBtn').textContent=saved[id]?'♥ Remove from My List':'♡ Add to My List'};if(t==='series'){let videos=current.videos||[];let seasons=[...new Set(videos.map(v=>v.season))].sort((a,b)=>a-b);$('episodes').innerHTML='<h2>Episodes</h2><select id="seasonSelect" style="background:#262733;color:white;padding:10px;border-radius:9px"></select><div id="episodeList"></div>';seasons.forEach(s=>{$('seasonSelect').add(new Option('Season '+s,s))});$('seasonSelect').onchange=()=>renderEpisodes(videos);renderEpisodes(videos)}}catch(e){$('info').textContent='Unable to load details.';}}
function renderEpisodes(videos){let s=Number($('seasonSelect').value);$('episodeList').innerHTML=videos.filter(v=>v.season===s).map(v=>'<button class="episode" data-id="'+escapeHTML(v.id)+'">Episode '+v.episode+': '+escapeHTML(v.title||'Untitled')+'</button>').join('');document.querySelectorAll('.episode').forEach(el=>el.onclick=()=>{episode=el.dataset.id;openVidlink()});}

let vidlinkCache={};try{vidlinkCache=JSON.parse(localStorage.getItem('lumen_vidlink_tmdb')||'{}')||{};}catch(e){vidlinkCache={};}
async function vidlinkTmdb(meta){
  const imdb=String(meta.id||'').split(':')[0], type=meta.type==='series'?'tv':'movie', key=type+':'+imdb;
  const direct=String(meta.moviedb_id||meta.tmdb_id||meta.tmdbId||meta.moviedbId||'');
  if(/^[1-9]\d*$/.test(direct))return direct;
  if(/^[1-9]\d*$/.test(String(vidlinkCache[key]||'')))return String(vidlinkCache[key]);
  if(!/^tt\d{6,12}$/.test(imdb))return null;
  // Cinemeta uses IMDb IDs. Wikidata can resolve missing TMDB movie/TV IDs without an API key.
  try{
    const prop=type==='movie'?'P4947':'P4983';
    const query='SELECT ?tmdb WHERE { ?item wdt:P345 "'+imdb+'"; wdt:'+prop+' ?tmdb. } LIMIT 1';
    const response=await getJSON('https://query.wikidata.org/sparql?format=json&query='+encodeURIComponent(query));
    const tmdb=String(response?.results?.bindings?.[0]?.tmdb?.value||'');
    if(/^[1-9]\d*$/.test(tmdb)){
      vidlinkCache[key]=tmdb;localStorage.setItem('lumen_vidlink_tmdb',JSON.stringify(vidlinkCache));return tmdb;
    }
  }catch(e){console.warn('TMDB lookup unavailable',e);}
  return null;
}
function selectedEpisode(){
  const videos=(current?.videos||[]).filter(v=>Number(v.season)>0&&Number(v.episode)>0).sort((a,b)=>a.season-b.season||a.episode-b.episode);
  return videos.find(v=>v.id===episode)||videos.find(v=>!v.released||Date.parse(v.released)<=Date.now())||null;
}
async function openVidlink(forcedId){
  if(!current)return;
  const showId=String(current.id||'').split(':')[0];
  const ep=current.type==='series'?selectedEpisode():null;
  if(current.type==='series'&&!ep){
    $('sources').innerHTML='<h2>Choose an episode</h2><p class="muted">Select a season and episode to start playback.</p>';
    return;
  }
  const selected=forcedId||await vidlinkTmdb(current);
  if(!selected){
    $('sources').innerHTML='<h2>Vidlink needs a TMDB ID</h2><p class="muted">Cinemeta provided an IMDb ID ('+escapeHTML(showId)+') but its TMDB ID could not be resolved automatically. Enter the numeric TMDB ID for this title.</p><div class="bar"><input id="manualTmdb" inputmode="numeric" placeholder="Numeric TMDB ID"><button class="primary" id="manualVidlink">Watch</button></div><p class="muted">Find the TMDB ID in the URL for this movie or TV show at themoviedb.org.</p>';
    $('manualVidlink').onclick=()=>{
      const x=$('manualTmdb').value.trim();
      if(!/^[1-9]\d*$/.test(x)){alert('Enter a numeric TMDB ID.');return;}
      const key=(current.type==='series'?'tv':'movie')+':'+showId;
      vidlinkCache[key]=x;localStorage.setItem('lumen_vidlink_tmdb',JSON.stringify(vidlinkCache));
      openVidlink(x);
    };
    $('sources').scrollIntoView({behavior:'smooth'});return;
  }
  const tmdb=String(selected);
  if(!/^[1-9]\d*$/.test(tmdb)){alert('TMDB ID is invalid.');return;}
  const url=current.type==='series'
    ?'https://vidlink.pro/tv/'+tmdb+'/'+Number(ep.season)+'/'+Number(ep.episode)
    :'https://vidlink.pro/movie/'+tmdb;
  const playerUrl=url+'?primaryColor=DB203D&secondaryColor=20202A&iconColor=FFFFFF&title=false&poster=true&autoplay=false&nextbutton=true';
  $('player').style.display='none';
  $('video').pause();
  $('video').removeAttribute('src');
  $('sources').innerHTML='<h2>Play inside LUMEN</h2><p class="muted">'+escapeHTML(current.name)+(ep?' · Season '+Number(ep.season)+', Episode '+Number(ep.episode):'')+'</p><div class="row"><button class="primary" id="jwBtn">▶ Mobile / JW player</button><button id="standardBtn">Standard player</button><button id="nativeBtn">Test native video</button><button id="otherSources">Other sources</button></div><p id="playerStatus" class="muted">The video opens in a dedicated full-screen player inside LUMEN. Mobile/JW is selected first. If it cannot play, return here and try Standard or the test clip.</p>';
  const launch=(engine)=>{
    if(!window.LUMEN_APP||typeof window.LUMEN_APP.openEmbed!=='function'){
      $('playerStatus').textContent='The Android in-app player is unavailable in this build.';
      return;
    }
    const streamUrl=engine==='jw'?playerUrl+'&player=jw':playerUrl;
    $('playerStatus').textContent='Opening '+(engine==='jw'?'mobile/JW':'standard')+' player inside LUMEN…';
    window.LUMEN_APP.openEmbed(streamUrl);
  };
  $('jwBtn').onclick=()=>launch('jw');
  $('standardBtn').onclick=()=>launch('standard');
  $('nativeBtn').onclick=()=>testNativeVideo();
  $('otherSources').onclick=()=>loadSources();
  launch('jw');

}

function testNativeVideo(){
  const url='https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4';
  if(window.LUMEN_APP&&typeof window.LUMEN_APP.openNative==='function')window.LUMEN_APP.openNative(url);
  else alert('Native video playback is available in the Android APK.');
}
async function loadSources(){if(!current)return;let id=current.type==='series'?(episode||(current.videos||[]).find(v=>v.season>0)?.id):current.id;if(!id){$('sources').innerHTML='<p>No episode selected.</p>';return;}$('sources').innerHTML='<h2>Playback sources</h2><p class="muted">Searching your configured authorized add-ons...</p>';let found=[];for(const addon of addons){try{let j=await getJSON(addon.replace(/\/manifest\.json$/,'')+'/stream/'+current.type+'/'+encodeURIComponent(id)+'.json');(j.streams||[]).forEach(x=>{if(x.url&&/^https:\/\//.test(x.url))found.push({...x,addon})})}catch(e){}}$('sources').innerHTML='<h2>Playback sources</h2>'+(found.length?found.map((v,i)=>'<div class="source"><button data-stream="'+i+'">▶ '+escapeHTML(v.title||v.name||'Play stream')+'</button></div>').join(''):'<p class="muted">No compatible streams found. Add an authorized Stremio-compatible provider in Sources, or play a direct HTTPS video link below.</p>')+'<div class="bar"><input id="directUrl" placeholder="Direct HTTPS .mp4 or .m3u8 video URL"><button onclick="directPlay()">Play</button></div>';document.querySelectorAll('[data-stream]').forEach(el=>el.onclick=()=>play(found[Number(el.dataset.stream)].url));}
function directPlay(){play($('directUrl').value.trim());}
function play(url){if(!/^https:\/\//.test(url)){alert('Only HTTPS video URLs are supported.');return;}if(window.LUMEN_APP&&typeof window.LUMEN_APP.openNative==='function'){window.LUMEN_APP.openNative(url);return;}$('player').style.display='block';$('video').src=url;$('video').load();$('video').play().catch(()=>{});$('notice').textContent='Direct video playback test. Some video codecs may not be supported.';$('player').scrollIntoView({behavior:'smooth'});}
function showProviders(){let value=prompt('Authorized Stremio-compatible add-on URL (HTTPS ending in /manifest.json). Leave empty to list configured providers.\\n\\nCurrent providers:\\n'+(addons.join('\\n')||'None'));if(value===null)return;if(!value.trim())return;if(!/^https:\/\/[^ ]+\/manifest\.json$/.test(value.trim())){alert('Enter a valid HTTPS manifest.json URL');return;}addons.push(value.trim());localStorage.setItem('lumen_addons',JSON.stringify(addons));alert('Provider added. To remove a provider, clear this app’s saved data.');}
function back(){$('video').pause();$('video').removeAttribute('src');$('browse').style.display='block';$('detail').style.display='none';episode=null;return true;}
window.lumenBack=()=>{if($('detail').style.display==='block'){back();return true;}return false};
init();
</script></body></html>
