name: Build KaiserWatch APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: kaiserwatch-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/src/main/assets/index.html').read_text()
          Path('/tmp/lumen.js').write_text(s.split('<script>', 1)[1].split('</script>', 1)[0])
          PY
          node --check /tmp/lumen.js
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KaiserWatch-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
